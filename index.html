<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Watch">
<title>Training Watch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #111418;
    --panel: #1b2027;
    --text: #f2f4f7;
    --muted: #8a94a3;
    --accent: #ff7a1a;
    --rest: #2fd17a;
    --danger: #ff4d5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    gap: 14px;
    user-select: none; -webkit-user-select: none;
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .label { font-size: 13px; color: var(--muted); letter-spacing: .08em; }

  header { display: flex; justify-content: space-between; align-items: baseline; }
  #clock { font-size: 28px; font-weight: 600; }
  #date { font-size: 13px; color: var(--muted); }

  .card { background: var(--panel); border-radius: 20px; padding: 16px; }

  #totalCard { text-align: center; }
  #total { font-size: clamp(48px, 17vw, 96px); font-weight: 700; line-height: 1.1; margin: 4px 0 12px; }
  #totalCard.running #total { color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > button { flex: 1; }

  button {
    font: inherit; font-weight: 700; font-size: 18px;
    border: 0; border-radius: 14px; padding: 16px 8px;
    color: var(--text); background: #2a313b; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #1a0d00; }
  button.stop { background: var(--danger); color: #fff; }
  button:disabled { opacity: .35; }

  #restCard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 260px; }
  .ring { position: relative; width: min(64vw, 260px); aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bg { stroke: #2a313b; }
  .ring .fg { stroke: var(--rest); stroke-linecap: round; transition: stroke-dashoffset .1s linear; }
  #rest { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          font-size: clamp(44px, 14vw, 72px); font-weight: 700; }
  #restCard.running #rest { color: var(--rest); }
  #restCard.done #rest { color: var(--accent); }
  #restBtn { width: 100%; background: var(--rest); color: #002611; font-size: 20px; padding: 20px 8px; }
  #restCard.running #restBtn { background: #2a313b; color: var(--text); }

  .setting { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .setting button { padding: 8px 14px; font-size: 16px; border-radius: 10px; }
  #restSetting { font-size: 20px; font-weight: 600; min-width: 64px; text-align: center; }

  .label-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; }
  .label-row .label { grid-column: 2; }
  #settingsBtn { grid-column: 3; justify-self: end; padding: 6px 10px; font-size: 13px; font-weight: 600; border-radius: 10px; color: var(--muted); }

  dialog {
    background: var(--panel); color: var(--text); border: 0; border-radius: 20px;
    padding: 20px; width: min(90vw, 340px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h2 { margin: 0 0 4px; font-size: 18px; }
  dialog p { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .pickers { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; font-size: 18px; }
  .pickers select {
    font: inherit; font-size: 24px; font-weight: 700; color: var(--text);
    background: #2a313b; border: 0; border-radius: 10px; padding: 8px 12px;
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="label">現在時刻</div>
      <div id="clock" class="num">--:--:--</div>
    </div>
    <div id="date"></div>
  </header>

  <section id="totalCard" class="card">
    <div class="label">トータル</div>
    <div id="total" class="num">0:00:00</div>
    <div class="row">
      <button id="startBtn" class="primary">開始</button>
      <button id="resetBtn" disabled>リセット</button>
    </div>
  </section>

  <section id="restCard" class="card">
    <div class="label-row">
      <div class="label">レスト</div>
      <button id="settingsBtn">デフォルト <span id="defaultLabel" class="num">1:30</span></button>
    </div>
    <div class="ring">
      <svg viewBox="0 0 120 120">
        <circle class="bg" cx="60" cy="60" r="54"></circle>
        <circle class="fg" id="ringFg" cx="60" cy="60" r="54"></circle>
      </svg>
      <div id="rest" class="num">1:30</div>
    </div>
    <div class="setting">
      <button id="minusBtn" aria-label="15秒減らす">−15s</button>
      <div id="restSetting" class="num">1:30</div>
      <button id="plusBtn" aria-label="15秒増やす">+15s</button>
    </div>
    <button id="restBtn">レスト開始</button>
  </section>

  <dialog id="settings">
    <form method="dialog">
      <h2>デフォルトのレスト時間</h2>
      <p>次回起動時やリセット時にこの時間がセットされます。</p>
      <div class="pickers">
        <select id="defMin" aria-label="分"></select>分
        <select id="defSec" aria-label="秒"></select>秒
      </div>
      <div class="row">
        <button value="cancel">キャンセル</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const fmtMS = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
  const fmtHMS = s => `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // 状態（タイムスタンプ基準なので画面スリープ・バックグラウンドでもずれない）
  const state = store.get('tw-state', { totalStart: null, totalEnd: null, restEnd: null });
  // デフォルトのレスト時間（保存される）と、今回の調整値（±15sは今回だけ）
  let defaultRest = store.get('tw-rest-default', store.get('tw-rest', 90));
  let restSec = defaultRest;
  let restFired = state.restEnd !== null && state.restEnd <= Date.now();
  const save = () => store.set('tw-state', state);

  // ---- サウンド ----
  let audio;
  const unlockAudio = () => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audio) audio = new AC();
    if (audio.state === 'suspended') audio.resume();
  };
  const beep = () => {
    if (!audio) return;
    const t0 = audio.currentTime + 0.02;
    [0, 0.25, 0.5].forEach((dt, i) => {
      const osc = audio.createOscillator();
      const g = audio.createGain();
      osc.type = 'square';
      osc.frequency.value = i === 2 ? 1320 : 880;
      const len = i === 2 ? 0.45 : 0.15;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + len);
      osc.connect(g).connect(audio.destination);
      osc.start(t0 + dt);
      osc.stop(t0 + dt + len + 0.02);
    });
    if (navigator.vibrate) navigator.vibrate([150, 100, 150, 100, 300]);
  };

  // ---- 画面スリープ防止 ----
  let wakeLock = null;
  const updateWakeLock = async () => {
    const want = state.totalStart !== null && state.totalEnd === null;
    try {
      if (want && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!want && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch {}
  };

  // ---- トータル ----
  $('startBtn').addEventListener('click', () => {
    unlockAudio();
    const now = Date.now();
    if (state.totalStart === null) {          // 開始
      state.totalStart = now; state.totalEnd = null;
    } else if (state.totalEnd === null) {     // 終了
      state.totalEnd = now;
      state.restEnd = null;
    } else {                                   // 再開（終了時点から継続）
      state.totalStart += now - state.totalEnd;
      state.totalEnd = null;
    }
    save(); updateWakeLock(); render();
  });
  $('resetBtn').addEventListener('click', () => {
    if (state.totalStart !== null && state.totalEnd === null && !confirm('計測中です。リセットしますか？')) return;
    state.totalStart = null; state.totalEnd = null; state.restEnd = null;
    restSec = defaultRest;
    save(); updateWakeLock(); render();
  });

  // ---- レスト ----
  const clampRest = s => Math.min(600, Math.max(5, s));
  const setRest = s => { restSec = clampRest(s); render(); };

  // デフォルト設定ダイアログ
  const dlg = $('settings');
  for (let m = 0; m <= 10; m++) $('defMin').add(new Option(m, m));
  for (let s = 0; s < 60; s += 5) $('defSec').add(new Option(pad(s), s));
  $('settingsBtn').addEventListener('click', () => {
    $('defMin').value = Math.floor(defaultRest / 60);
    $('defSec').value = defaultRest % 60 - (defaultRest % 5);
    dlg.showModal();
  });
  dlg.querySelector('button[value=save]').addEventListener('click', () => {
    defaultRest = clampRest(+$('defMin').value * 60 + +$('defSec').value);
    store.set('tw-rest-default', defaultRest);
    restSec = defaultRest;
    render();
  });
  $('minusBtn').addEventListener('click', () => setRest(restSec - 15));
  $('plusBtn').addEventListener('click', () => setRest(restSec + 15));
  $('restBtn').addEventListener('click', () => {
    unlockAudio();
    const now = Date.now();
    if (state.restEnd !== null && state.restEnd > now) {
      state.restEnd = null;                    // キャンセル
    } else {
      state.restEnd = now + restSec * 1000;    // 開始
      state.restDur = restSec;
      restFired = false;
      // トータル未開始ならレスト開始と同時にスタート
      if (state.totalStart === null) { state.totalStart = now; state.totalEnd = null; updateWakeLock(); }
    }
    save(); render();
  });

  // ---- 描画 ----
  const C = 2 * Math.PI * 54;
  $('ringFg').style.strokeDasharray = C;

  function render() {
    const now = Date.now();
    const d = new Date(now);
    $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    $('date').textContent = d.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' });

    // トータル
    const running = state.totalStart !== null && state.totalEnd === null;
    const elapsed = state.totalStart === null ? 0 : ((state.totalEnd ?? now) - state.totalStart);
    $('total').textContent = fmtHMS(Math.floor(elapsed / 1000));
    $('totalCard').classList.toggle('running', running);
    $('startBtn').textContent = state.totalStart === null ? '開始' : running ? '終了' : '再開';
    $('startBtn').className = running ? 'stop' : 'primary';
    $('resetBtn').disabled = state.totalStart === null;

    // レスト
    const remainMs = state.restEnd === null ? null : state.restEnd - now;
    const restRunning = remainMs !== null && remainMs > 0;
    if (remainMs !== null && remainMs <= 0 && !restFired) {
      restFired = true;
      // 大きく遅れて復帰した場合（数秒以上前に終了）は鳴らさない
      if (remainMs > -3000) beep();
    }
    const done = remainMs !== null && remainMs <= 0;
    const shownSec = restRunning ? Math.ceil(remainMs / 1000) : done ? 0 : restSec;
    $('rest').textContent = fmtMS(shownSec);
    const frac = restRunning ? remainMs / ((state.restDur || restSec) * 1000) : done ? 0 : 1;
    $('ringFg').style.strokeDashoffset = C * (1 - Math.min(1, Math.max(0, frac)));
    $('restCard').classList.toggle('running', restRunning);
    $('restCard').classList.toggle('done', done);
    $('restBtn').textContent = restRunning ? 'キャンセル' : 'レスト開始';
    $('restSetting').textContent = fmtMS(restSec);
    $('defaultLabel').textContent = fmtMS(defaultRest);
  }

  setInterval(render, 100);
  document.addEventListener('visibilitychange', () => { updateWakeLock(); render(); });
  updateWakeLock();
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
